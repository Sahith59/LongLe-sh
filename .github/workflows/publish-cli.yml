name: Verify and publish CLI

on:
  pull_request:
    paths:
      - '.github/workflows/publish-cli.yml'
      - 'packages/cli/**'
      - 'packages/app/**'
      - 'packages/daemon/**'
      - 'packages/protocol/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: read

concurrency:
  group: longleash-cli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clean-tarball:
    name: Clean tarball (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux Node 22
            os: ubuntu-latest
            node: 22.14.0
          - label: macOS Node 24
            os: macos-14
            node: 24
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.33.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: npm install --global npm@11.12.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @longleash/cli typecheck
      - run: pnpm --filter @longleash/cli test
      - run: pnpm --filter @longleash/cli shrinkwrap:check
      - run: pnpm --filter @longleash/cli build
      - run: pnpm --filter @longleash/cli pack:verify
      - name: Install and exercise the actual tarball
        shell: bash
        run: LONGLEASH_SMOKE_DAEMON=1 node packages/cli/scripts/smoke-tarball.mjs packages/cli/dist-pack/*.tgz
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: matrix.os == 'ubuntu-latest'
        with:
          name: longleash-cli-${{ github.sha }}
          path: packages/cli/dist-pack/*.tgz
          if-no-files-found: error
          retention-days: 14

  systemd-user:
    name: Real systemd user lifecycle (Linux)
    needs: clean-tarball
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: longleash-cli-${{ github.sha }}
          path: release
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.12.1
      - name: Start the real per-user systemd manager
        shell: bash
        run: |
          sudo systemctl start "user@$(id -u).service"
          test -S "/run/user/$(id -u)/bus"
      - name: Exercise install, crash, update, logs, stop, start, and uninstall
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          bash packages/cli/scripts/systemd-acceptance.sh release/*.tgz

  publish:
    name: Publish with npm trusted publishing
    needs: [clean-tarball, systemd-user]
    if: startsWith(github.ref, 'refs/tags/cli-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.12.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: longleash-cli-${{ github.sha }}
          path: release
      - name: Require an exact tag-to-artifact version match
        shell: bash
        run: |
          shopt -s nullglob
          tarballs=(release/*.tgz)
          test "${#tarballs[@]}" -eq 1
          tarball=$(realpath "${tarballs[0]}")
          package_version=$(tar -xOf "$tarball" package/package.json | node -e \
            "let body=''; process.stdin.on('data', chunk => body += chunk); process.stdin.on('end', () => console.log(JSON.parse(body).version))")
          tag_version=${GITHUB_REF_NAME#cli-v}
          test "$package_version" = "$tag_version"
      - name: Publish the exact verified package
        shell: bash
        run: |
          shopt -s nullglob
          tarballs=(release/*.tgz)
          test "${#tarballs[@]}" -eq 1
          # An unqualified `release/file.tgz` is a valid npm package spec and can be parsed as a
          # GitHub shorthand. Resolve the verified artifact to an absolute filesystem path so npm
          # cannot reinterpret it as a repository.
          tarball=$(realpath "${tarballs[0]}")
          package_version=${GITHUB_REF_NAME#cli-v}
          if [[ "$package_version" == *-* ]]; then
            npm publish "$tarball" --access public --tag rc
          else
            npm publish "$tarball" --access public --tag latest
          fi
