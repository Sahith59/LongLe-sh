name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: longleash-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 10.33.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: npm install --global npm@11.12.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=moderate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @longleash/cli shrinkwrap:check
      - run: pnpm --filter @longleash/cli pack:verify
      - name: Install and exercise the CLI tarball
        run: LONGLEASH_SMOKE_DAEMON=1 node packages/cli/scripts/smoke-tarball.mjs packages/cli/dist-pack/*.tgz
      - run: pnpm --dir packages/relay exec wrangler deploy --dry-run
      - run: pnpm vscode:package
      - run: pnpm vscode:verify-package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: longleash-vscode-${{ github.sha }}
          path: packages/vscode/dist-vsix/*.vsix
          if-no-files-found: error
          retention-days: 14

  # The deploy path is part of the product: a Dockerfile that stopped building would only
  # be discovered by whoever tried to self-host, which is exactly the wrong person to find it.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker build -t longleash-relay .
      - name: the relay must actually answer
        run: |
          trap 'docker rm -f relay >/dev/null 2>&1 || true' EXIT
          docker run -d -p 8080:8080 --name relay longleash-relay
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/health && break || sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health | grep -q '"role":"relay"'
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'

  deploy-production:
    name: Deploy production
    needs: [test, image]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://app.longleash.dev
    concurrency:
      group: longleash-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 10.33.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy the exact tested commit
        run: pnpm --dir packages/relay exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify the live release
        run: pnpm verify:production
        env:
          EXPECTED_BUILD: ${{ github.sha }}
